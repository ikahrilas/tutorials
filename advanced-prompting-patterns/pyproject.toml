[project]
name = "advanced-prompting-patterns"
version = "0.1.0"
description = "Structured-output prompting patterns: schema validation, self-repair loops, and multi-step pipelines."
readme = "README.md"
authors = [
    { name = "ikahrilas", email = "ijk60068@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.uv]
# A collection of scripts, not an installable library.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules under test live at the repo root rather than in a package.
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
extend-exclude = ["solution-files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
